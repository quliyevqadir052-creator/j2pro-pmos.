name: Build postmarketOS for J2 Pro 2018 (j2y18lte)

on:
  workflow_dispatch:

jobs:
  build-pmos:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 1. Sistem paketlərini quraşdır
        run: sudo apt-get update && sudo apt-get install -y python3-pip git curl

      - name: 2. pmbootstrap quraşdır
        run: |
          pip3 install --user --break-system-packages pmbootstrap
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: 3. Konfiqurasiya və quraşdırma
        run: |
          pmbootstrap -y init --workspace=/home/runner/work/pmos --device=samsung-j2y18lte --ui=console
          pmbootstrap -y install --android-recovery-zip || pmbootstrap -y install

      - name: 4. Faylları topla
        run: |
          mkdir -p ~/output_files
          pmbootstrap export ~/output_files
          ls -lh ~/output_files/

      - name: 5. Artifacts-ə yüklə
        uses: actions/upload-artifact@v4
        with:
          name: postmarketOS-samsung-j2y18lte
          path: ~/output_files/*
          retention-days: 7
          
